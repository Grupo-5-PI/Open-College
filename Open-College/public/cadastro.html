<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>

    <script src="./js/sessao.js"></script>
    <link rel="icon" href="img/logo/logo.png">
    <link rel="stylesheet" href="./style/global.css">
    <link rel="stylesheet" href="./style/cadastroLogin.css">



</head>

<body>

    <header class="navbar">
        <div class="navbar-logo">
            <a href="index.html"><img src="./img/logo/logo.png" alt="Open College"></a>
        </div>
    </header>

    <h1 class="cadastro-titulo">CRIE SUA CONTA</h1>
    <a href="login.html" class="cadastro-link-login">JÁ POSSUI CONTA ? FAÇA SEU LOGIN</a>

    <!--<div class="progresso-container">
        <div class="progresso-barra">
            <div class="progresso-preenchido"></div> 
        </div>
         <span class="progresso-texto">PASSO 1 DE 3 : VALIDAÇÃO</span> 
    </div>-->

    <div class="perfil-seletor">
        <select id="select_perfil" class="perfil-btn ativo">
        <option value="" disabled selected hidden>Selecione seu perfil</option>
        <option value="Investidor">Investidor</option>
        <option value="Gerente de Marketing">Gerente de Marketing</option>
    </select>

    </div>

    <div class="formulario-caixa">
        <div class="campo-grupo">
            <label><img src="./img/icones/iconUsuario.png" alt=""> NOME</label>
            <input type="text" placeholder="João Silva" id="ipt_nome">
        </div>

        <div class="campo-grupo">
            <label><img src="./img/icones/iconCPF.png" alt=""> CPF</label>
            <input type="text" placeholder="000.000.000-00" maxlength="14" oninput="this.value= mascaraCpf(this.value)"
             id="ipt_cpf">
        </div>

        <div class="campo-grupo">
            <label><img src="./img/icones/iconTelefone.png" alt=""> TELEFONE</label>
            <input type="text" placeholder="(11) 99999-8888" maxlength="15"  oninput="this.value= mascaraTelefone(this.value)"
            id="ipt_telefone">
        </div>

        <div class="campo-grupo">
            <label><img src="./img/icones/iconEmail.png" alt=""> E-MAIL</label>
            <input type="text" placeholder="Insira seu e-mail" id="ipt_login">
        </div>

        <div class="campo-grupo">
            <label><img src="./img/icones/iconSenha.png" alt=""> SENHA</label>
            <input type="password" placeholder="Senha mais de 6 caracteres" id="ipt_senha">
        </div>


        <div class="campo-grupo">
            <label><img src="./img/icones/iconSenha.png" alt=""> CONFIRME SUA SENHA</label>
            <input type="password" placeholder="••••••••" id="ipt_senhaConfirmar">
        </div>

        <div class="campo-grupo campo-foto">
            <label><img src="./img/icones/iconAnexo_img.png" alt=""> LINK SUA FOTO (OPCIONAL)</label>
            <input id="ipt_foto" type="url" placeholder="https://exemplo.com" maxlength="1000">
        </div>

        <div class="container-btn-etapa">
            <button type="button" class="btn-proxima-etapa" onclick="cadastrar()">PRÓXIMA ETAPA</button>
        </div>

        <div class="card_erro" id="cardErro">
            <span id="mensagem_erro"></span>
        </div>
    </div>

    <div class="footer">
        <p>COPYRIGHT © 2026 - OPENCOLLEGE. TODOS OS DIREITOS RESERVADOS.</p>
    </div>

</html>

<script>

  

     function mascaraCpf(limpo) {

        return limpo.replace(/\D/g, '') // aqui remove tudo que nao e numero
            .replace(/^(\d{3})(\d)/, '$1.$2') // coloca os ponto dos 3 primeiros digitos
            .replace(/^(\d{3})\.(\d{3})(\d)/, '$1.$2.$3') // ponto dps do 6 digito
            .replace(/^(\d{3})\.(\d{3})\.(\d{3})(\d)/, '$1.$2.$3-$4') // ponto e o hifen             
            .slice(0, 14); // deixa o tamanho maximo em 14
    }
    function mascaraTelefone(limpo){
        return limpo.replace(/\D/g,'') // remove tudo que nao e numero
        .replace(/^(\d{2})(\d)/g, '($1) $2') // parenteses no DDD
        .replace(/(\d{5})(\d)/, '$1-$2') // coloca o hifen pos o 5 digito
        .slice(0,15); // limita o tamanho em 15
    }


    function cadastrar() {

        let admin = null;
        let nomeVar = ipt_nome.value;
        let cpfVar = ipt_cpf.value.replace(/\D/g, '') ;
        let telefoneVar = ipt_telefone.value.replace(/\D/g, '');
        let emailVar = ipt_login.value;
        let senhaVar = ipt_senha.value;
        let confirmacaoSenhaVar = ipt_senhaConfirmar.value;
        let perfilVar = select_perfil.value;
        let fotoVar = ipt_foto.value;
        let msg = '';





        if (
            nomeVar == "" ||
            cpfVar == "" ||
            telefoneVar == "" ||
            emailVar == "" ||
            senhaVar == "" ||
            confirmacaoSenhaVar == ""
        ) { // verificar os campos em branco

            cardErro.style.display = "block";
            mensagem_erro.innerHTML =
                "Existem campos em branco, preencha os dados corretamente para continuar.";
            setTimeout(sumirMensagem, 3000);

            return false;


        } 
        if(perfilVar == ""){
            alert("Selecione um perfil para continuar");
            return false;
        }      
        
        if (nomeVar !== '') {
            if (nomeVar.length <= 1) { // verificar se o tamanho do nome é maior que 1
                cardErro.style.display = "block";
                mensagem_erro.innerHTML = `Nome inválido`
                setTimeout(sumirMensagem, 3000);

                return false;
            }

            for (let i = 0; i < nomeVar.length; i++) {

                if (nomeVar[i] == ' ') {
                    continue; // para se o nome tiver espaço, caso contrario nao da para cadastrar nomes como Vitor Henrique
                }

                if (nomeVar[i].toLowerCase() == nomeVar[i].toUpperCase()) { // se o caractere digitado nao tiver como ser transformado para letra maiuscula ent é numero ou simbolo
                    cardErro.style.display = "block";
                    mensagem_erro.innerHTML = `Nome inválido`

                    setTimeout(sumirMensagem, 3000);

                    return false;
                }

            }

        }if(cpfVar.length !== 11){
            cardErro.style.display = "block";
            mensagem_erro.innerHTML =
                "CPF inválido";
            setTimeout(sumirMensagem, 3000);
            return false;
        } 
        if(telefoneVar.length !== 11){
            cardErro.style.display = "block";
            mensagem_erro.innerHTML =
                "Número de telefone inválido";
            setTimeout(sumirMensagem, 3000);
            return false;
        }    
        if (!emailVar.includes('@') || !emailVar.endsWith('.com')) {
            cardErro.style.display = "block";
            mensagem_erro.innerHTML =
                "Insira um email válido, email deve conter @ e .com";
            setTimeout(sumirMensagem, 3000);

            return false;
        } if (senhaVar.length <= 6) {
            cardErro.style.display = "block";
            mensagem_erro.innerHTML =
                "Senha inválida, insira mais de 6 caracteres";
            setTimeout(sumirMensagem, 3000);

            return false;
        } if (senhaVar != confirmacaoSenhaVar || confirmacaoSenhaVar != senhaVar) {
            cardErro.style.display = "block";
            mensagem_erro.innerHTML =
                "Confirmação de senha negada. Senhas diferentes";

            setTimeout(sumirMensagem, 3000);

            return false;
        }

        if(perfilVar == "Investidor"){
            admin = 0;
        }else{
            admin = 1;
        }
        


        fetch("/usuarios/cadastrar", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
            },
            body: JSON.stringify({
                nomeServer: nomeVar,
                cpfServer: cpfVar,
                telefoneServer: telefoneVar,
                emailServer: emailVar,
                senhaServer: senhaVar,
                perfilServer: perfilVar,
                fotoServer: fotoVar,
                adminServer: admin,


            }),
        })
            .then(function (resposta) {
                console.log("resposta: ", resposta);

                if (resposta.ok) {
                    return resposta.json().then(function (resultado){
                        sessionStorage.setItem("idUsuario", resultado.insertId);
                    

                    cardErro.style.display = "none";
                    

                    setTimeout(() => {
                        window.location = "cadastroInstituicao.html";
                    }, 2000);

                    limparFormulario();
                });
                }else {
                    throw "Houve um erro ao tentar realizar o cadastro!";
                }
            })
            .catch(function (resposta) {
                console.log(`#ERRO: ${resposta}`);



            });

        return false;

        function sumirMensagem() {
            cardErro.style.display = "none";
            mensagem_erro.innerHTML = "";

        }
    }

</script>
