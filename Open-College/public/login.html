<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <script src="./js/sessao.js"></script>
    <link rel="icon" href="img/logo/logo.png">
    <link rel="stylesheet" href="./style/global.css">
    <link rel="stylesheet" href="./style/cadastroLogin.css">

</head>

<body>
    <header class="navbar">
        <div class="navbar-logo">
            <a href="index.html"><img src="./img/logo/logo.png" alt="Open College"></a>
        </div>
    </header>

    <h1 class="cadastro-titulo">FAÇA SEU LOGIN</h1>
    <a href="cadastro.html" class="cadastro-link-login">AINDA NÃO TENHO UMA CONTA</a>

    <div class="formulario-caixa">
        <div class="campo-grupo">
            <label><img src="./img/icones/iconEmail.png" alt=""> EMAIL</label>
            <input type="text" placeholder="joaosilva@gmail.com" id="ipt_login">
        </div>

        <div class="campo-grupo">
            <label><img src="./img/icones/iconSenha.png" alt=""> SENHA</label>
            <input type="password" placeholder="••••••••" id="ipt_senha">
        </div>

        <div class="container-btn-etapa">
            <button type="button" class="btn-proxima-etapa" onclick="logar()">ENTRAR</button>
        </div>

        <div class="card_erro" id="cardErro">
            <span id="mensagem_erro"></span>
        </div>
    </div>

    <footer class="footer">
        <p>COPYRIGHT © 2026 - OPENCOLLEGE. TODOS OS DIREITOS RESERVADOS.</p>
    </footer>




</body>

</html>
<script>

    function logar() {


        let emailVar = ipt_login.value;
        let senhaVar = ipt_senha.value;

        if (emailVar == "" || senhaVar == "") {
            cardErro.style.display = "block"
            mensagem_erro.innerHTML = "Insira os dados no campo";
            setTimeout(sumirMensagem, 2000);


            return false;

        }
        else {
            setTimeout(sumirMensagem, 2000)
        }

        console.log("FORM LOGIN: ", emailVar);
        console.log("FORM SENHA: ", senhaVar);

        fetch("/usuarios/autenticar", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                emailServer: emailVar,
                senhaServer: senhaVar,

            })
        }).then(function (resposta) {
            console.log("ESTOU NO THEN DO logar()!")

            if (resposta.ok) {
                console.log(resposta);

                resposta.json().then(json => {
                    console.log(json);
                    console.log(JSON.stringify(json));
                    sessionStorage.EMAIL_USUARIO = json.email;
                    sessionStorage.NOME_USUARIO = json.nome;
                    sessionStorage.ID_USUARIO = json.id;

                    alert("Login feito com sucesso!")

                    setTimeout(function () {
                        window.location = "index.html";
                    }, 1000); // apenas para exibir o loading

                });

            } else {
                alert("Email ou senha invalidos")
                console.log("Houve um erro ao tentar realizar o login!");

                resposta.text().then(texto => {
                    console.error(texto);

                });
            }

        }).catch(function (erro) {
            console.log(erro);
        })

        return false;
    }

    function sumirMensagem() {
        cardErro.style.display = "none";
        mensagem_erro.innerHTML = "";

    }


</script>
