<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minha Instituição - Curso</title>
    <link rel="stylesheet" href="../style/plataforma_global_style.css">
    <link rel="stylesheet" href="../style/minha_instituicao_style.css">
</head>
<body>
    
    <main>

        <header>
            <div class="header-esquerda">
                <span>Curso 1</span>
            </div>
            <div class="header-direita">
                <button>Editar Curso</button>
                <button>Adicionar ao Feed de Atualizações</button>
            </div>
        </header>

        <div class="main-conteudo">

            <div class="dados-curso">
                <span>Polo: Município Exemplo</span>
                <span>Turno: Diurno</span>
                <span>Modalidade: Presencial</span>
            </div>

            <div class="sessao-pag-curso">

                <span class="titulo-sessao-pag-curso">Estatísticas</span>
                
                <table>
                    <tr>
                        <th>VAGAS</th>
                        <th>MATRÍCULAS</th>
                    </tr>
                    <tr>
                        <td>999</td>
                        <td>999</td>
                    </tr>
                </table>
                
                <div>
                    <span>Atualizado por último em: DD/MM/YYYY</span>
                    <button>Atualizar</button>
                </div>
                
            </div>

            <div class="sessao-pag-curso">

                <span class="titulo-sessao-pag-curso">Metas</span>
                
                <table>
                    <tr>
                        <th>MATRÍCULAS</th>
                    </tr>
                    <tr>
                        <td>999</td>
                    </tr>
                </table>
                
                <div>
                    <span>Para: DD/MM/YYYY</span>
                    <button>Atualizar</button>
                </div>
                
            </div>

        </div>

    </main>
    
</body>
</html>
