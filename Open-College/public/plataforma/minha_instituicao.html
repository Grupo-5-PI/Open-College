            <ul id="nav-item">
                <li class="nav-item active">
                    <a href="dashGeral.html">

        <div class="sair">
            <div class="btn-sair">
                <button>
                    <img src="../img/icones/iconSair.png" alt="Sair" class="icone-menu-lateral">
                    <span>Sair</span>
                </button>
            </div>
        </div>

    <main>
        <header>
            <div class="header-esquerda">
                <span>Minha Instituição</span>
            </div>
            <div class="header-direita">
                <button onclick="abrirFecharPopup('popup_adicionar_polo')">Adicionar Polo</button>
            </div>
        </header>
        
        <div class="main-conteudo">

            <div class="sessao-filtros">
                <select name="filtro-polos-uf" id="filtro_polos_uf" class="selecao-filtro">
                    <option value="0" selected disabled>UF</option>
                </select>

                <select name="filtro-polos-municipio" id="filtro_polos_municipio" class="selecao-filtro">
                    <option value="0" selected disabled>Município</option>
                </select>

                <button>Limpar Filtros</button>
            </div>
            
            <input type="text" id="polos_barra_de_pesquisa" placeholder="Pesquisar" class="barra-de-pesquisa">
            
            <div class="sessao-polos">

                <a href="./minha_instituicao_polo.html" class="item-sessao-polos">
                    <div class="item-sessao-polos-esquerda">
                        <div class="nome-polo">Polo Município 1</div>
                        
                        <div class="endereco-polo">
                            <span>Município | UF</span>
                            <br>
                            <span>Rua Exemplo, 1234, Bairro</span>
                        </div>
                    </div>

                    <div class="item-sessao-polos-direita">
                        <span class="qtd-cursos">Quantidade de Cursos: 3</span>
                    </div>
                </a>

                <a  href="./minha_instituicao_polo.html" class="item-sessao-polos">
                    <div class="item-sessao-polos-esquerda">
                        <div class="nome-polo">Polo Município 2</div>
                        
                        <div class="endereco-polo">
                            <span>Município | UF</span>
                            <br>
                            <span>Rua Amostra, 5678, Bairro</span>
                        </div>
                    </div>

                    <div class="item-sessao-polos-direita">
                        <span class="qtd-cursos">Quantidade de Cursos: 5</span>
                    </div>
                </a>

            </div>
            
        </div>
    </main>
    
    
    <div class="container-popup" id="popup_adicionar_polo">
        <div class="sombra-popup"   onclick="abrirFecharPopup('popup_adicionar_polo')"></div>

        <div class="popup-interacao">
            <div class="header-popup">
                <span onclick="abrirFecharPopup('popup_adicionar_polo')">
                    <img src="../img/icones/icon_x_branco.png" alt="" class="icone-sair">
                </span>
                <span class="titulo-popup">Adicionar Polo</span>
            </div>
            
            <div class="inputs-popup">
                <div class="separacao-inputs-popup">
                    <div class="input-popup" style="width: 70%">
                        <label for="logradouro">LOGRADOURO: </label>
                        <input type="text" name="logradouro">
                    </div>
                    
                    <div class="input-popup" style="width: 30%">
                        <label for="numero">NÚMERO: </label>
                        <input type="text" name="numero">
                    </div>
                </div>
                
                <div class="separacao-inputs-popup">
                    <div class="input-popup" style="width: 35%;">
                        <label for="bairro">BAIRRO: </label>
                        <input type="text" name="bairro">
                    </div>
                    
                    <div class="input-popup" style="width: 55%">
                        <label for="municipio">MUNICÍPIO: </label><br>
                        <select name="municipio" id="">
                            <option value="0"></option>
                        </select>
                    </div>
                    
                    <div class="input-popup" style="width: 10%">
                        <label for="uf">UF: </label><br>
                        <select name="uf" id="">
                            <option value="0"></option>
                        </select>
                    </div>
                </div>
            </div>
            

            <div class="popup-interacao-botoes">
                <button>
                    ADICIONAR
                </button>
            </div>
            
        </div>
    </div>

</body>
