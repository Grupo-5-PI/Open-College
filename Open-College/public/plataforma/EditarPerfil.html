<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Editar Perfil</title>

    <link rel="stylesheet" href="../style/global.css">
    <link rel="stylesheet" href="../style/EditarPerfil.css">

    <link rel="icon" href="../img/logo/logo.png">
</head>

<body>

    <!-- ================= MENU LATERAL ================= -->

    <nav class="menu-lateral">

        <header class="menu-lateral-logo">
            <span class="logo">
                <img src="../img/logo/logo.png" alt="">
            </span>
        </header>

        <nav class="content">

            <ul id="nav-item">

                <li class="nav-item">
                    <a href="dashGeral.html">
                        <img src="../img/icones/iconHome.png" alt="Dashboard" class="icone-menu-lateral">
                        <span class="titulo-menu-lateral">
                            Dashboard
                        </span>
                    </a>
                </li>

                <li class="nav-item">
                    <a href="minha_instituicao.html">

                        <img src="../img/icones/iconNotificacao.png" alt="Painel de Atualização"
                            class="icone-menu-lateral">

                        <span class="titulo-menu-lateral">
                            Painel de Atualização
                        </span>

                    </a>
                </li>

                <li class="nav-item">
                    <a href="">

                        <img src="../img/icones/iconInstituicao.png" alt="Minha Instituição" class="icone-menu-lateral">

                        <span class="titulo-menu-lateral">
                            Minha Instituição
                        </span>

                    </a>
                </li>

                <li class="nav-item active">
                    <a href="EditarPerfil.html">

                        <img src="../img/icones/iconPerfil.png" alt="Minha conta" class="icone-menu-lateral">

                        <span class="titulo-menu-lateral">
                            Minha conta
                        </span>

                    </a>
                </li>

            </ul>

        </nav>

        <div class="sair">

            <div class="btn-sair">

                <button>

                    <img src="../img/icones/iconSair.png" alt="Sair" class="icone-menu-lateral">

                    <span>Sair</span>

                </button>

            </div>

        </div>

    </nav>


    <!-- ================= CONTEÚDO ================= -->

    <main>

        <section class="perfil-container">

            <!-- ================= PERFIL ================= -->

            <div class="perfil-resumo">

                <div onclick="mudarFotoPerfil()" id="perfilIcone"" class=" perfil-icone">
                </div>

                <div class="perfil-informacoes">

                    <h1 id="nomePerfil">JOÃO SILVA</h1>

                    <span id="cargoPerfil" class="perfil-cargo">
                        Analista de Marketing
                    </span>

                    <div class="cadastro-verificado">

                        <span class="icone-verificado">✓</span>

                        <span>
                            Cadastro Verificado
                        </span>

                    </div>

                </div>

            </div>


            <!-- ================= DADOS CADASTRAIS ================= -->

            <div class="dados-cadastrais">

                <h2>Meus Dados Cadastrais</h2>


                <form>

                    <div class="formulario">


                        <!-- NOME -->

                        <div class="campo">

                            <label for="nome">
                                <img src="../img/icones/iconUsuario.png" alt="Email" class="icone-campo">

                                NOME
                            </label>

                            <input type="text" id="nome" name="nome" placeholder="João Silva">

                        </div>


                        <!-- CPF -->

                        <div class="campo">

                            <label for="cpf">
                                <img src="../img/icones/iconCPF.png" alt="CPF" class="icone-campo">
                                CPF
                            </label>

                            <input type="text" id="cpf" name="cpf" placeholder="000.000.000-00">

                        </div>


                        <!-- TELEFONE -->

                        <div class="campo">

                            <label for="telefone">
                                <img src="../img/icones/iconTelefone.png" alt="Email" class="icone-campo">

                                TELEFONE
                            </label>

                            <input type="tel" id="telefone" name="telefone" placeholder="(XX) X XXXX-XXXX">

                        </div>


                        <!-- EMAIL -->

                        <div class="campo">

                            <label for="email">
                                <img src="../img/icones/iconEmail.png" alt="Email" class="icone-campo">

                                EMAIL
                            </label>

                            <input type="email" id="email" name="email" placeholder="joaosilva@gmail.com">

                        </div>


                        <!-- SENHA -->

                        <div class="campo">

                            <label for="senha">
                                <img src="../img/icones/iconSenha.png" alt="Email" class="icone-campo">

                                SENHA
                            </label>

                            <input type="password" id="senha" name="senha" placeholder="........">

                        </div>


                        <!-- CONFIRMAR SENHA -->

                        <div class="campo">

                            <label for="confirmarSenha">
                                <img src="../img/icones/iconSenha.png" alt="Email" class="icone-campo">

                                CONFIRME SUA SENHA
                            </label>

                            <input type="password" id="confirmarSenha" name="confirmarSenha" placeholder="........">

                        </div>

                    </div>


                    <!-- BOTÃO -->

                    <div class="area-botao">

                        <button type="submit" class="btn-atualizar">
                            ATUALIZAR
                        </button>

                    </div>

                </form>

            </div>

        </section>

    </main>


    <!-- ================= FOOTER ================= -->

    <footer class="footer">

        <p>
            COPYRIGHT © 2026 - OPENCOLLEGE. TODOS OS DIREITOS RESERVADOS.
        </p>

    </footer>

</body>
