    <main>
        <header>
            <div class="header-esquerda">
                <span>Polo Município 1</span>
            </div>
            <div class="header-direita">
                <button>Adicionar Curso</button>
                <button>Editar Polo</button>
            </div>
        </header>
        
        <div class="main-conteudo">

            <div class="sessao-filtros">
                <select name="filtro-cursos-area" id="filtro-cursos-area" class="selecao-filtro">
                    <option value="0" selected disabled>Área</option>
                </select>

                <select name="filtro-cursos-curso" id="filtro_cursos-curso" class="selecao-filtro">
                    <option value="0" selected disabled>Curso</option>
                </select>

                <select name="filtro-cursos-modalidade" id="filtro_cursos-modalidade" class="selecao-filtro">
                    <option value="0" selected disabled>Modalidade</option>
                </select>

                <select name="filtro-cursos-turno" id="filtro_cursos-turno" class="selecao-filtro">
                    <option value="0" selected disabled>Turno</option>
                </select>

                <button>Limpar Filtros</button>
            </div>
            
            <input type="text" id="polos_barra_de_pesquisa" placeholder="Pesquisar" class="barra-de-pesquisa">
            
            <div class="sessao-polos">

                <a href="./minha_instituicao_curso.html" class="item-sessao-polos">
