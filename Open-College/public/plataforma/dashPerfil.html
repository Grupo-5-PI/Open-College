<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | Perfil </title>
    <link rel="stylesheet" href="../style/global.css">
    <link rel="stylesheet" href="../style/dashboard.css">
    <link rel="stylesheet" href="../style/menuLateral.css">
    <link rel="icon" href="../img/logo/logo.png">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.0.0"></script>
    <script src="../js/sessao.js"></script>
</head>

<!-- onload="validarSessao()" -->

<body>
    <nav class="menu-lateral">
        <header class="menu-lateral-logo">
            <a href="" class="perfil-link">
                <div class="foto-wrapper">
                    <img id="imgUsuario" alt="foto de perfil" class="foto-perfil">
                </div>
                <span class="nome-usuario" id="b_usuario">Carregando...</span>
            </a>
        </header>
        <nav class="content">
            <ul id="nav-item">
                <li class="nav-item active">
                    <a href="dashGeral.html">
                        <img src="../img/icones/iconHome.png" alt="Dashboard" class="icone-menu-lateral">
                        <span class="titulo-menu-lateral">
                            Dashboard
                        </span>
                    </a>
                </li>

                <li class="nav-item">
                    <a href="painelAtualizacao.html">
                        <img src="../img/icones/iconNotificacao.png" alt="Painel de Atualização"
                            class="icone-menu-lateral">
                        <span class="titulo-menu-lateral">
                            Painel de Atualização
                        </span>
                    </a>
                </li>

                <li class="nav-item">
                    <a href="minha_instituicao.html">
                        <img src="../img/icones/iconInstituicao.png" alt="Minha Instituição" class="icone-menu-lateral">
                        <span class="titulo-menu-lateral">
                            Minha Instituição
                        </span>
                    </a>
                </li>

                <li class="nav-item">
                    <a href="EditarPerfil.html">
                        <img src="../img/icones/iconPerfil.png" alt="Minha conta" class="icone-menu-lateral">
                        <span class="titulo-menu-lateral">
                            Minha conta
                        </span>
                    </a>
                </li>
            </ul>
        </nav>

        <div class="sair">
            <div class="btn-sair">
                <button onclick="limparSessao()">
                    <img src="../img/icones/iconSair.png" alt="Sair" class="icone-menu-lateral">
                    <span>Sair</span>
                </button>
            </div>
        </div>
    </nav>
    <main>
        <div class="painel-fundo">
            <header class="header-dash">
                <a href="dashGeral.html" class="buttons-header">Geral</a>
                <a href="dashPerfil.html" class="buttons-header active">Perfil</a>
                <a href="dashDemanda.html" class="buttons-header">Demanda</a>
                <a href="dashRegiao.html" class="buttons-header">Região</a>
                <a href="dashTendencia.html" class="buttons-header">Tendência</a>
                <a href="dashPersonalizada.html" class="buttons-header btn-add">+</a>

                <nav class="nav-dash">
                    <p>Dashboard - Perfil (ANO)</p>
                    <select class="filtro-ano">
                        <option>2025</option>
                        <option>2024</option>
                        <option>2023</option>
                        <option>2022</option>
                        <option>2021</option>
                        <option>2020</option>
                        <option>2019</option>
                    </select>
                </nav>
            </header>

            <div class="container-graficos">
                <div class="grafico">
                    <canvas id="grafico-faixa-etaria"></canvas>
                </div>
                <div class="grafico">
                    <canvas id="grafico-por-genero"></canvas>
                </div>
                <div class="grafico">
                    <canvas id="grafico-publico-privada"></canvas>
                </div>
            </div>

        </div>
    </main>
    <div class="footer">
        <p>COPYRIGHT © 2026 - OPENCOLLEGE. TODOS OS DIREITOS RESERVADOS.</p>
    </div>
</body>

</html>


<script>

    let dadosEtarios = [];
    let dadosRede = [];
    let dadosGenero = [];

    let foto = sessionStorage.FOTO_USUARIO;
    imgUsuario.src = `${foto}`

    Chart.register(ChartDataLabels);

    let tituloDash = document.querySelector('.nav-dash p')
    let filtroAno = document.querySelector('.filtro-ano')

    async function atualizarPerfil() {

        let anoSelecionado = filtroAno.value;

        tituloDash.textContent = `Dashboard - Perfil (${anoSelecionado})`;

        try {
            const resposta = await fetch(`/dashboard/atualizarPerfil?ano=${anoSelecionado}`);

            console.log('Status:', resposta.status);

            if (!resposta.ok) {
                throw new Error('Erro ao buscar dados do perfil');
            }

            const dados = await resposta.json();

            console.log('Resposta do servidor:', dados);

            dadosEtarios = dados[0];

            carregarGraficoEtario();

        } catch (erro) {
            console.error('Erro na requisição:', erro);
        }
    }

    async function atualizarRede() {

        let anoSelecionado = filtroAno.value;

        tituloDash.textContent = `Dashboard - Perfil (${anoSelecionado})`;

        try {
            const resposta = await fetch(`/dashboard/atualizarRede?ano=${anoSelecionado}`);

            console.log('Status:', resposta.status);

            if (!resposta.ok) {
                throw new Error('Erro ao buscar dados da rede');
            }

            const dados = await resposta.json();

            console.log('Resposta do servidor:', dados);

            dadosRede = dados[0];

            carregarPublicoPrivada();

        } catch (erro) {
            console.error('Erro na requisição:', erro);
        }
    }

    async function atualizarGenero() {

        let anoSelecionado = filtroAno.value;

        tituloDash.textContent = `Dashboard - Perfil (${anoSelecionado})`;

        try {
            const resposta = await fetch(`/dashboard/atualizarGenero?ano=${anoSelecionado}`);

            console.log('Status:', resposta.status);

            if (!resposta.ok) {
                throw new Error('Erro ao buscar dados de genero');
            }

            const dados = await resposta.json();

            console.log('Resposta do servidor:', dados);

            dadosGenero = dados[0];

            carregarPorGenero();

        } catch (erro) {
            console.error('Erro na requisição:', erro);
        }
    }

    filtroAno.addEventListener('change', atualizarPerfil);
    filtroAno.addEventListener('change', atualizarRede);
    filtroAno.addEventListener('change', atualizarGenero);


    atualizarPerfil()
    atualizarRede()
    atualizarGenero()

    let graficoEtario;
    let graficoRede;
    let graficoGenero;

    function carregarGraficoEtario() {

        if (graficoEtario) {
            graficoEtario.destroy();
        }

        let faixaEtaria = document.getElementById('grafico-faixa-etaria')

        graficoEtario = new Chart(faixaEtaria, {
            type: 'bar',
            data: {
                labels: ['18 A 24', '25 A 29', '30 A 34', '35 A 39', '40 A 49', '50 A 59', '60 ou mais'],
                datasets: [
                    {
                        type: 'line',
                        label: 'Meta Mínima',
                        data: [150, 150, 150, 150, 150, 150, 150],
                        borderColor: '#ff5555',
                        borderWidth: 2,
                        pointRadius: 0,
                        fill: false,
                        datalabels: {
                            display: false
                        }
                    },
                    {
                        type: 'bar',
                        label: 'Número de Alunos',
                        data: [
                            dadosEtarios.qtdMatricula1824,
                            dadosEtarios.qtdMatricula2529,
                            dadosEtarios.qtdMatricula3034,
                            dadosEtarios.qtdMatricula3539,
                            dadosEtarios.qtdMatricula4049,
                            dadosEtarios.qtdMatricula5059,
                            dadosEtarios.qtdMatricula60Mais
                        ],
                        backgroundColor: [
                            '#4a7ff7', '#ae8df5', '#f3b86b', '#ffde59', '#ef737c', '#e978c4', '#5cd4d3'
                        ],
                        borderRadius: 2
                    }
                ]
            },
            options: {
                responsive: true,
                plugins: {
                    legend: {
                        display: false
                    },
                    title: {
                        display: true,
                        text: 'Gráfico de distribuição por faixa etária',
                        color: '#ffffff',
                        font: { size: 23, family: 'Telegraf' },
                        padding: { bottom: 20 }
                    },
                    datalabels: {
                        anchor: 'end',
                        align: 'top',
                        color: '#ffffff',
                        font: {
                            weight: 'bold',
                            size: 15
                        }
                    }
                },
                scales: {
                    y: {
                        beginAtZero: true,
                        max: 300,
                        ticks: { color: '#ffffff' },
                        grid: { display: false }
                    },
                    x: {
                        ticks: { color: '#ffffff' },
                        grid: { display: false }
                    }
                }
            }
        })
    }



    function carregarPorGenero() {

        let porGenero = document.getElementById('grafico-por-genero');

        if (graficoGenero) {
            graficoGenero.destroy();
        }

        graficoGenero = new Chart(porGenero, {
            type: 'pie',
            data: {
                labels: ['Feminino', 'Masculino'],
                datasets: [{
                    data: [
                        dadosGenero.porcentagemFeminina,
                        dadosGenero.porcentagemMasculina
                    ],
                    backgroundColor: ['#4a7ff7', '#ae8df5'],
                    borderWidth: 0
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    title: {
                        display: true,
                        text: 'Distribuição por gênero',
                        color: '#ffffff',
                        font: {
                            size: 23,
                            family: 'Telegraf'
                        },
                        padding: {
                            bottom: 20
                        }
                    },
                    datalabels: {
                        color: '#ffffff',
                        font: {
                            weight: 'bold',
                            size: 15
                        },
                        formatter: (valor) => `${valor}%`
                    },
                    legend: {
                        position: 'left',
                        labels: {
                            color: '#ffffff',
                            boxWidth: 12,
                            padding: 15
                        }
                    }
                }
            }
        });
    }


    function carregarPublicoPrivada() {

        let publicoPrivada = document.getElementById('grafico-publico-privada');

        if (graficoRede) {
            graficoRede.destroy();
        }

        graficoRede = new Chart(publicoPrivada, {
            type: 'pie',
            data: {
                labels: ['Rede Pública', 'Rede Privada'],
                datasets: [{
                    data: [
                        dadosRede.porcentagemPublica,
                        dadosRede.porcentagemPrivada
                    ],
                    backgroundColor: ['#ef737c', '#ffde59'],
                    borderWidth: 0
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    title: {
                        display: true,
                        text: 'Ingressantes da rede pública x rede privada',
                        color: '#ffffff',
                        font: {
                            size: 23,
                            family: 'Telegraf'
                        },
                        padding: {
                            bottom: 20
                        }
                    },
                    datalabels: {
                        color: '#000',
                        font: {
                            weight: 'bold',
                            size: 15
                        },
                        formatter: (valor) => `${valor}%`
                    },
                    legend: {
                        position: 'left',
                        labels: {
                            color: '#ffffff',
                            boxWidth: 16,
                            boxHeight: 16,
                            padding: 15,
                            font: {
                                size: 15,
                                family: 'Telegraf'
                            }
                        }
                    }
                }
            }
        });
    }

    carregarPorGenero()

</script>
